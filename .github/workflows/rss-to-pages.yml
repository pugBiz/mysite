name: RSS Watcher

permissions:
  contents: write

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min; */10 invites rate limiting
  workflow_dispatch:
    inputs:
      watch_term:
        description: 'Optional term to use for this run (overrides config.json)'
        required: false

concurrency:
  group: rss-watcher
  cancel-in-progress: false

jobs:
  run-watcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set WATCH_TERM if provided
        if: ${{ github.event.inputs.watch_term != '' }}
        run: echo "WATCH_TERM=${{ github.event.inputs.watch_term }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watcher
        run: python watcher.py --debug

      - name: Commit updated matches.json and state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -qE "matches.json|state.json"; then
            git add matches.json state.json
            git commit -m "Update matches.json"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
