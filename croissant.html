<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CroissantWatcher — Matches</title>
  <meta name="description" content="Live view of matches from monitored subreddits; set your watch term and refresh on demand." />
  <style>
    :root{
      --bg: #ffffff;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #0a84ff;
      --border: #e6e6e6;
      --shadow: rgba(15,23,42,0.04);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b1020;
        --card: #0f1724;
        --text: #e6eef8;
        --muted: #9aa6b2;
        --accent: #58a6ff;
        --border: #1f2937;
        --shadow: rgba(2,6,23,0.6);
      }
    }
    [data-theme="dark"]{
      --bg: #0b1020;
      --card: #0f1724;
      --text: #e6eef8;
      --muted: #9aa6b2;
      --accent: #58a6ff;
      --border: #1f2937;
      --shadow: rgba(2,6,23,0.6);
    }
    [data-theme="light"]{
      --bg: #ffffff;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #0a84ff;
      --border: #e6e6e6;
      --shadow: rgba(15,23,42,0.04);
    }

    html,body{height:100%}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin:0; padding:28px; background:var(--bg); color:var(--text);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }

    .container{max-width:980px; margin:0 auto;}
    header{display:flex; gap:12px; align-items:center; margin-bottom:12px;}
    h1{margin:0; font-size:1.4rem;}
    .status{color:var(--muted); font-size:0.95rem;}
    .controls{margin-left:auto; display:flex; gap:8px; align-items:center;}
    .time{color:var(--muted); font-size:0.9rem;}
    button{background:var(--card); color:var(--text); border:1px solid var(--border); padding:8px 12px; border-radius:8px; cursor:pointer; box-shadow:0 1px 2px var(--shadow);}
    button:active{transform:translateY(1px)}
    .match{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent); border:1px solid var(--border); padding:14px; border-radius:10px; margin:12px 0; box-shadow:0 6px 18px var(--shadow);}
    .match a{color:var(--accent); text-decoration:none; font-weight:600;}
    .meta{color:var(--muted); font-size:0.9rem; margin-top:6px;}
    .empty{color:var(--muted); margin-top:18px;}
    .badge{background:var(--card); border:1px solid var(--border); padding:6px 8px; border-radius:999px; color:var(--muted); font-size:0.85rem;}
    .toggle{display:inline-flex; gap:8px; align-items:center;}
    .sr-only{position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;}
    .refreshing .status { color: var(--accent); font-weight:600; }
    .controls-row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
    input[type="text"]{padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); min-width:220px;}
    .small { font-size:0.9rem; color:var(--muted); }
    @media (max-width:640px){
      body{padding:18px}
      .controls{flex-direction:column; align-items:flex-end}
    }
  </style>
</head>
<body>
  <div class="container" id="pageRoot">
    <header>
      <div>
        <h1>CroissantWatcher</h1>
        <div class="status">Watching for <strong id="displayTerm">"bake croissants"</strong></div>
      </div>

      <div class="controls" aria-hidden="false">
        <div class="time" id="lastUpdated">—</div>
        <div style="width:8px"></div>
        <button id="manualRefresh" title="Refresh now">Refresh now</button>
        <div style="width:8px"></div>
        <div class="toggle" title="Toggle theme">
          <button id="themeToggle" aria-pressed="false">Toggle theme</button>
        </div>
      </div>
    </header>

    <section class="controls-row" aria-label="Watch term controls">
      <label for="termInput" class="small sr-only">Watch term</label>
      <input id="termInput" type="text" placeholder='Watch terms, comma-separated, e.g. bake croissants, lamination' aria-label="Watch terms" />
      <button id="saveTerm">Save term</button>
      <button id="clearTerm" title="Reset to server default">Reset</button>
      <div class="small" id="termHint">Separate multiple terms with commas. Server terms are authoritative for scheduled runs; a local override only filters what this browser displays &mdash; it cannot fetch terms the server never searched for.</div>
    </section>

    <main>
      <div id="matchesContainer">
        <p class="empty">Loading matches…</p>
      </div>
    </main>
  </div>

  <script>
    // Configuration
    const MATCHES_JSON = './matches.json';
    const POLL_INTERVAL_MS = 20000;
    const DEFAULT_TERMS = ['bake croissants'];
    const TERM_KEY = 'croissant_watch_term';
    const THEME_KEY = 'croissant_theme';

    // State
    let pollTimer = null;
    let currentTerms = DEFAULT_TERMS.slice();
    let serverTerms = null;

    // Elements
    const termInput = document.getElementById('termInput');
    const saveTermBtn = document.getElementById('saveTerm');
    const clearTermBtn = document.getElementById('clearTerm');
    const displayTerm = document.getElementById('displayTerm');
    const manualRefreshBtn = document.getElementById('manualRefresh');
    const themeToggle = document.getElementById('themeToggle');

    // Theme handling (persisted)
    function applyTheme(theme){
      if(theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
      else if(theme === 'light') document.documentElement.setAttribute('data-theme','light');
      else document.documentElement.removeAttribute('data-theme');
      themeToggle.setAttribute('aria-pressed', theme === 'dark');
    }
    function getStoredTheme(){ return localStorage.getItem(THEME_KEY); }
    function detectSystemPref(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    const storedTheme = getStoredTheme();
    if(storedTheme === 'dark' || storedTheme === 'light') applyTheme(storedTheme);
    else applyTheme(null);
    themeToggle.addEventListener('click', () => {
      const current = getStoredTheme() || detectSystemPref();
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    // Local term persistence
    function loadLocalTerm(){
      const raw = localStorage.getItem(TERM_KEY);
      const terms = parseTerms(raw);
      if(terms.length){
        currentTerms = terms;
        termInput.value = terms.join(', ');
        displayTerm.textContent = formatTerms(terms);
        return true;
      }
      return false;
    }
    function saveLocalTerm(){
      const terms = parseTerms(termInput.value);
      if(terms.length === 0){
        localStorage.removeItem(TERM_KEY);
        currentTerms = serverTerms || DEFAULT_TERMS.slice();
      } else {
        localStorage.setItem(TERM_KEY, terms.join(', '));
        currentTerms = terms;
      }
      termInput.value = currentTerms.join(', ');
      displayTerm.textContent = formatTerms(currentTerms);
      pollStop();
      fetchMatches();
    }
    function clearLocalTerm(){
      localStorage.removeItem(TERM_KEY);
      currentTerms = serverTerms || DEFAULT_TERMS.slice();
      termInput.value = currentTerms.join(', ');
      displayTerm.textContent = formatTerms(currentTerms);
      pollStop();
      fetchMatches();
    }
    saveTermBtn.addEventListener('click', saveLocalTerm);
    clearTermBtn.addEventListener('click', clearLocalTerm);
    termInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') saveLocalTerm(); });

    // Utilities
    // "bake, cold proof" -> ["bake", "cold proof"]
    function parseTerms(str){
      return String(str || '')
        .split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);
    }
    function formatTerms(terms){
      return terms.map(t => `"${t}"`).join(', ');
    }
    function formatTime(ts){
      try { return new Date(ts).toLocaleString(); } catch(e){ return ts; }
    }
    function escapeHtml(s){
      if(!s) return '';
      return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Stem-aware matching, mirrors term_matches() in watcher.py.
    // "bake" matches "baking" / "baker" / "baked", not just the literal substring.
    const WORD_RE = /[a-z0-9']+/g;
    function termMatches(text, term){
      if(!term) return true;
      const t = String(term).toLowerCase().trim();
      const hay = String(text || '').toLowerCase();
      if(hay.includes(t)) return true;

      const words = t.match(WORD_RE) || [];
      if(words.length === 0) return false;
      const tokens = hay.match(WORD_RE) || [];

      return words.every(w => {
        const stem = (w.length > 3 && w.endsWith('e')) ? w.slice(0, -1) : w;
        if(stem.length < 3) return tokens.includes(w);
        return tokens.some(tok => tok.startsWith(stem));
      });
    }

    // Fetch and render with server-term sync
    async function fetchMatches(){
      try {
        const res = await fetch(MATCHES_JSON + '?_=' + Date.now(), {cache:'no-store'});
        if(!res.ok){
          showEmpty(`No data (HTTP ${res.status}) — tried ${new URL(MATCHES_JSON, location.href).href}`);
          schedulePoll();
          return;
        }
        const data = await res.json();

        // Prefer the watch_terms array; fall back to the legacy watch_term string
        if(data && Array.isArray(data.watch_terms) && data.watch_terms.length){
          serverTerms = data.watch_terms.map(t => String(t).trim()).filter(Boolean);
        } else if(data && data.watch_term){
          serverTerms = parseTerms(data.watch_term);
        } else {
          serverTerms = null;
        }
        if(serverTerms && serverTerms.length === 0) serverTerms = null;

        // If the user has no local override, adopt the server terms
        const localTerms = parseTerms(localStorage.getItem(TERM_KEY));
        if(localTerms.length === 0){
          currentTerms = serverTerms || DEFAULT_TERMS.slice();
          termInput.value = currentTerms.join(', ');
        } else {
          currentTerms = localTerms;
        }
        displayTerm.textContent = formatTerms(currentTerms);

        renderMatchesFiltered(data);
      } catch (err){
        showEmpty('Error fetching matches');
        schedulePoll();
      }
    }

    function showEmpty(text){
      const c = document.getElementById('matchesContainer');
      c.innerHTML = `<p class="empty">${escapeHtml(text)}</p>`;
      document.getElementById('lastUpdated').textContent = 'Last checked: ' + formatTime(Date.now());
      document.documentElement.classList.remove('refreshing');
    }

    function renderMatchesFiltered(data){
      const c = document.getElementById('matchesContainer');
      if(!data || !Array.isArray(data.matches) || data.matches.length === 0){
        c.innerHTML = '<p class="empty">No matches found in source.</p>';
        document.getElementById('lastUpdated').textContent = 'Last checked: ' + formatTime(Date.now());
        schedulePoll();
        return;
      }

      const terms = (currentTerms && currentTerms.length ? currentTerms : DEFAULT_TERMS)
        .map(t => t.toLowerCase());
      const filtered = data.matches.filter(m => {
        const haystack = [m.title, m.excerpt, m.subreddit].filter(Boolean).join(' ');
        return terms.some(t => termMatches(haystack, t));
      });

      if(filtered.length === 0){
        c.innerHTML = `<p class="empty">No matches for ${escapeHtml(formatTerms(currentTerms))} (source has ${data.matches.length} items).</p>`;
        document.getElementById('lastUpdated').textContent = 'Last checked: ' + formatTime(Date.now());
        schedulePoll();
        return;
      }

      // Stop polling when matches exist so user can read
      pollStop();

      const html = filtered.map(m => {
        const excerpt = (m.excerpt || '').replace(/\n/g,' ').slice(0, 400);
        const title = m.title || excerpt || m.url;
        return `
          <article class="match" id="match-${escapeHtml(m.id)}" role="article" aria-labelledby="title-${escapeHtml(m.id)}">
            <div><a id="title-${escapeHtml(m.id)}" href="${escapeHtml(m.url)}" target="_blank" rel="noopener">${escapeHtml(title)}</a></div>
            <div class="meta">r/${escapeHtml(m.subreddit)} • by u/${escapeHtml(m.author)} • ${escapeHtml(m.type || 'post')}${m.matched_term ? ' • matched ' + escapeHtml('"' + m.matched_term + '"') : ''}</div>
            <div style="margin-top:10px; color:var(--text);">${escapeHtml(excerpt)}</div>
            <div class="meta" style="margin-top:8px;">Found: ${formatTime(m.found_at || Date.now())}</div>
          </article>`;
      }).join('\n');

      c.innerHTML = html;
      document.getElementById('lastUpdated').textContent = 'Matches found: ' + filtered.length + ' • ' + formatTime(Date.now());
      document.documentElement.classList.remove('refreshing');
    }

    function schedulePoll(){
      if(pollTimer) return;
      pollTimer = setTimeout(() => { pollTimer = null; fetchMatches(); }, POLL_INTERVAL_MS);
      document.documentElement.classList.add('refreshing');
    }

    function pollStop(){
      if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
      document.documentElement.classList.remove('refreshing');
    }

    // Manual refresh
    manualRefreshBtn.addEventListener('click', () => {
      pollStop();
      fetchMatches();
    });

    // Initialize: load local term if present, then fetch (server term may override display if no local)
    loadLocalTerm();
    fetchMatches();
  </script>
</body>
</html>
