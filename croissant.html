<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CroissantWatcher — Matches</title>
  <meta name="description" content="Live view of matches for 'bake croissants' from monitored subreddits." />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width:900px; margin:36px auto; padding:0 18px; color:#111; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    h1 { margin:0; font-size:1.4rem; }
    .status { color:#666; font-size:0.95rem; }
    .match { border:1px solid #eee; padding:12px; border-radius:8px; margin:12px 0; background:#fff; }
    .match a { color:#0366d6; text-decoration:none; font-weight:600; }
    .meta { color:#666; font-size:0.9rem; margin-top:6px; }
    .empty { color:#888; margin-top:18px; }
    .refreshing { color:#0a84ff; font-weight:600; }
    .time { color:#999; font-size:0.9rem; margin-left:8px; }
    .controls { margin-top:12px; }
    button { padding:8px 12px; border-radius:8px; border:1px solid #ddd; background:#fafafa; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>CroissantWatcher</h1>
      <div class="status">Watching for <strong>"bake croissants"</strong></div>
    </div>
    <div style="margin-left:auto; text-align:right;">
      <div id="lastUpdated" class="time">—</div>
      <div class="controls"><button id="manualRefresh">Refresh now</button></div>
    </div>
  </header>

  <main>
    <div id="matchesContainer">
      <p class="empty">Loading matches…</p>
    </div>
  </main>

  <script>
    // Configuration
    const MATCHES_JSON = '/matches.json'; // served from gh-pages root
    const POLL_INTERVAL_MS = 20000; // 20 seconds
    let pollTimer = null;
    let lastSeenIds = new Set();

    function formatTime(ts) {
      try {
        const d = new Date(ts);
        return d.toLocaleString();
      } catch (e) { return ts; }
    }

    async function fetchMatches() {
      try {
        const res = await fetch(MATCHES_JSON + '?_=' + Date.now(), {cache: 'no-store'});
        if (!res.ok) {
          showEmpty(`No data (HTTP ${res.status})`);
          schedulePoll();
          return;
        }
        const data = await res.json();
        renderMatches(data);
      } catch (err) {
        showEmpty('Error fetching matches');
        schedulePoll();
      }
    }

    function showEmpty(text) {
      const c = document.getElementById('matchesContainer');
      c.innerHTML = `<p class="empty">${text}</p>`;
      document.getElementById('lastUpdated').textContent = 'Last checked: ' + formatTime(Date.now());
    }

    function renderMatches(data) {
      const c = document.getElementById('matchesContainer');
      if (!data || !Array.isArray(data.matches) || data.matches.length === 0) {
        c.innerHTML = '<p class="empty">No matches found.</p>';
        document.getElementById('lastUpdated').textContent = 'Last checked: ' + formatTime(Date.now());
        schedulePoll();
        return;
      }

      // If there are matches, show them and stop auto-refreshing the whole page.
      pollStop();

      // Build list
      const html = data.matches.map(m => {
        const excerpt = (m.excerpt || '').replace(/\n/g, ' ').slice(0, 300);
        return `
          <div class="match" id="match-${m.id}">
            <div><a href="${m.url}" target="_blank" rel="noopener">${escapeHtml(m.title || excerpt || m.url)}</a></div>
            <div class="meta">r/${escapeHtml(m.subreddit)} • by u/${escapeHtml(m.author)} • ${escapeHtml(m.type || 'post')}</div>
            <div style="margin-top:8px; color:#222;">${escapeHtml(excerpt)}</div>
            <div class="meta">Found: ${formatTime(m.found_at || Date.now())}</div>
          </div>`;
      }).join('\n');

      c.innerHTML = html;
      document.getElementById('lastUpdated').textContent = 'Matches found: ' + data.matches.length + ' • ' + formatTime(Date.now());
    }

    function escapeHtml(s) {
      if (!s) return '';
      return s.replace(/[&<>"']/g, function (m) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]);
      });
    }

    function schedulePoll() {
      if (pollTimer) return;
      pollTimer = setTimeout(() => {
        pollTimer = null;
        fetchMatches();
      }, POLL_INTERVAL_MS);
      document.querySelector('.status').classList.add('refreshing');
    }

    function pollStop() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
      document.querySelector('.status').classList.remove('refreshing');
    }

    document.getElementById('manualRefresh').addEventListener('click', () => {
      pollStop();
      fetchMatches();
    });

    // Initial fetch and start polling
    fetchMatches();
  </script>
</body>
</html>
